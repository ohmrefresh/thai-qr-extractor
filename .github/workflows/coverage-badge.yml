name: Update Coverage Badge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm test -- --coverage --watchAll=false

    - name: Extract coverage percentage
      id: coverage
      run: |
        COVERAGE=$(node -e "const c = require('./coverage/coverage-summary.json'); console.log(Math.round(c.total.lines.pct * 100) / 100)")
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE%"

    - name: Generate coverage badge
      uses: schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: YOUR_GIST_ID_HERE
        filename: coverage-badge.json
        label: coverage
        message: ${{ steps.coverage.outputs.coverage }}%
        color: ${{ steps.coverage.outputs.coverage > 80 && 'brightgreen' || steps.coverage.outputs.coverage > 60 && 'yellow' || 'red' }}

    - name: Create coverage report badge
      run: |
        COVERAGE=${{ steps.coverage.outputs.coverage }}
        COLOR="brightgreen"
        if (( $(echo "$COVERAGE < 80" | bc -l) )); then
          COLOR="yellow"
        fi
        if (( $(echo "$COVERAGE < 60" | bc -l) )); then
          COLOR="red"
        fi
        
        echo "Badge URL: https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}"
